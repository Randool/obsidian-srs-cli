<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">obsrs — terminal flashcards for Obsidian Spaced Repetition</title>
  <desc id="d">A dark banner: the wordmark obsrs on the left, a mock terminal review screen on the right showing a card with per-grade interval previews.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0d131b"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#58a6ff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#56d364" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="420" rx="28"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .dim { fill: #8b949e; }
      .body { fill: #c9d1d9; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <ellipse cx="300" cy="40" rx="520" ry="260" fill="url(#glow)"/>
    <ellipse cx="1120" cy="400" rx="380" ry="200" fill="url(#glow)" opacity="0.5"/>
    <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="28" fill="none" stroke="#1f2937" stroke-width="1.5"/>

    <!-- left: identity -->
    <g transform="translate(72 84)">
      <g class="mono">
        <text x="0" y="0" font-size="12" letter-spacing="2.4" fill="#6e7681">OBSIDIAN SPACED REPETITION · CLI</text>
      </g>

      <text x="-4" y="92" class="mono" font-size="96" font-weight="700" letter-spacing="-3" fill="url(#word)">obsrs</text>

      <text x="0" y="140" class="sans" font-size="21" fill="#b6c2cf">Review your Obsidian flashcards in the terminal.</text>
      <text x="0" y="170" class="sans" font-size="21" fill="#8b949e">Same schedule as the plugin, no Obsidian needed.</text>

      <g class="mono" font-size="12.5">
        <g>
          <rect x="0" y="200" width="104" height="30" rx="15" fill="#0f1a24" stroke="#243b53"/>
          <text x="16" y="220" fill="#79c0ff">SM-2-OSR</text>
        </g>
        <g transform="translate(116 0)">
          <rect x="0" y="200" width="186" height="30" rx="15" fill="#0f1a24" stroke="#243b53"/>
          <text x="16" y="220" fill="#79c0ff">plugin-compatible</text>
        </g>
        <g transform="translate(314 0)">
          <rect x="0" y="200" width="122" height="30" rx="15" fill="#0f1a24" stroke="#243b53"/>
          <text x="16" y="220" fill="#79c0ff">zero deps</text>
        </g>
      </g>

      <g class="mono" font-size="13" transform="translate(0 292)">
        <text x="0" y="0" fill="#4d5866">$</text>
        <text x="16" y="0" fill="#8b949e">npm i -g obsidian-srs-cli</text>
        <rect x="220" y="-10" width="7" height="14" fill="#58a6ff" opacity="0.75"/>
      </g>
    </g>

    <!-- right: terminal mock -->
    <g transform="translate(624 78)">
      <rect x="0" y="0" width="584" height="264" rx="14" fill="#0b1017" stroke="#22303d" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="584" height="36" rx="14" fill="#121a23"/>
      <rect x="0" y="22" width="584" height="14" fill="#121a23"/>
      <circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
      <circle cx="40" cy="18" r="5.5" fill="#ffbd2e"/>
      <circle cx="60" cy="18" r="5.5" fill="#27c93f"/>
      <g class="mono" font-size="13">
        <text x="80" y="23" fill="#8b949e">obsrs · science/biology · 3/40</text>
        <text x="432" y="23" fill="#6e7681">answered 2</text>
      </g>
      <rect x="0" y="36" width="584" height="1" fill="#22303d"/>
      <rect x="352" y="45" width="212" height="4" rx="2" fill="#1c2733"/>
      <rect x="352" y="45" width="64" height="4" rx="2" fill="url(#bar)"/>

      <!-- card -->
      <rect x="18" y="62" width="548" height="96" rx="8" fill="#0d141c" stroke="#22303d"/>
      <g class="mono">
        <text x="34" y="91" font-size="15" fill="#d4dde6">What drives ATP synthesis at the inner membrane?</text>
        <line x1="34" y1="105" x2="196" y2="105" stroke="#2b3947"/>
        <text x="204" y="109" font-size="11.5" fill="#6e7681">answer</text>
        <text x="34" y="133" font-size="14.5" fill="#9fb0c0">A proton gradient — H+ flows back, turns ATP synthase</text>
      </g>

      <!-- grades -->
      <g class="mono" font-size="14.5" font-weight="700">
        <text x="18" y="196" fill="#f85149">1 Again</text>
        <text x="95" y="196" font-weight="400" fill="#7d8590">now</text>
        <text x="133" y="196" fill="#d29922">2 Hard</text>
        <text x="198" y="196" font-weight="400" fill="#7d8590">3d</text>
        <text x="230" y="196" fill="#3fb950">3 Good</text>
        <text x="295" y="196" font-weight="400" fill="#7d8590">14d</text>
        <text x="333" y="196" fill="#58a6ff">4 Easy</text>
        <text x="398" y="196" font-weight="400" fill="#7d8590">20d</text>
      </g>
      <text x="18" y="224" class="mono" font-size="12.5" fill="#5b6675">Space reveal · z undo · s skip · x shuffle · q finish</text>

      <g class="mono" font-size="10.5" fill="#3d4854">
        <text x="18" y="246">~/.config/srs/config.json → vault resolved</text>
      </g>
    </g>
  </g>
</svg>
